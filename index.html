<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#fbf8ee" />
    <title>2048 Fusion - Slide, merge, win</title>
    <meta
      name="description"
      content="Play 2048 Fusion: slide the tiles, merge matching numbers and chase the 2048 tile. Power-ups, a midnight board theme and stats that save right in your browser."
    />
    <!-- Relative paths keep the build working on root domains and subpaths alike -->
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./favicon.svg" />
    <link rel="manifest" href="./site.webmanifest" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="2048 Fusion - Slide, merge, win" />
    <meta
      property="og:description"
      content="Slide the tiles, merge matching numbers and chase the 2048 tile. Power-ups, a midnight board and local stats."
    />
    <meta property="og:image" content="./og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="./og.png" />

    <!--
      Fonts load without blocking first paint: the stylesheet starts as print-only
      and is promoted once it arrives, with a noscript fallback.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="font-family: sans-serif; padding: 24px; text-align: center">
        2048 Fusion needs JavaScript enabled to run.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
